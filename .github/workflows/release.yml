# Cut a release from a tag.
#
# Trigger:  git tag v0.9.0 && git push origin v0.9.0
#
# THE TAG AND THE SOURCE MUST AGREE. The first job refuses to publish when the
# tag does not match project(... VERSION ...) in CMakeLists.txt. Without that
# check the two drift silently and you end up shipping a binary that prints a
# different version than the release it is attached to, which is the sort of
# thing nobody notices until they are debugging a user's bug report against the
# wrong source.
#
# Every artifact is built from the tagged commit by the same CMake the developers
# use; nothing is uploaded from a workstation.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (must already exist)'
        required: true

permissions:
  contents: write

jobs:
  verify-version:
    name: Tag matches source version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # MUST be explicit. On a tag push github.ref is the tag, but on a
          # workflow_dispatch it is whatever branch the UI defaulted to - so
          # without this a manual run builds main, checks main's version against
          # the tag, and publishes the result under the tag's name. The binaries
          # would not be the tagged source and nothing would say so.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - id: check
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          tag_version="${tag#v}"

          # Read the single source of truth rather than a duplicated constant.
          src_version=$(grep -oP 'project\(jc_reborn VERSION \K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt)

          echo "tag    : $tag  (version $tag_version)"
          echo "source : $src_version  (CMakeLists.txt)"

          if [ "$tag_version" != "$src_version" ]; then
            echo "FAIL tag $tag does not match project(... VERSION $src_version ...) in CMakeLists.txt"
            echo "     bump CMakeLists.txt and re-tag, or tag v$src_version"
            exit 1
          fi
          echo "version=$src_version" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows package
    needs: verify-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # MUST be explicit. On a tag push github.ref is the tag, but on a
          # workflow_dispatch it is whatever branch the UI defaulted to - so
          # without this a manual run builds main, checks main's version against
          # the tag, and publishes the result under the tag's name. The binaries
          # would not be the tagged source and nothing would say so.
          ref: ${{ github.event.inputs.tag || github.ref }}

      # The full gate, not just a build: a release must pass the same smoke and
      # regression checks a commit does.
      - shell: pwsh
        run: .\gate.ps1

      - name: package
        shell: pwsh
        run: |
          $v = '${{ needs.verify-version.outputs.version }}'
          $stage = "jc_reborn-$v-windows-x64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item build/Release/jc_reborn.exe        $stage/
          # The screensaver is a second target from the same sources, built
          # /SUBSYSTEM:WINDOWS. It is the reason most people will download this,
          # so shipping only the console exe would miss the point.
          Copy-Item build/Release/jc_reborn.scr        $stage/
          Copy-Item build/Release/scrantic_data.zip    $stage/
          Copy-Item README.md, LICENSE                 $stage/
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: '*.zip'
          if-no-files-found: error

  linux:
    name: Linux package
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # MUST be explicit. On a tag push github.ref is the tag, but on a
          # workflow_dispatch it is whatever branch the UI defaulted to - so
          # without this a manual run builds main, checks main's version against
          # the tag, and publishes the result under the tag's name. The binaries
          # would not be the tagged source and nothing would say so.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake libx11-dev libasound2-dev

      - name: build and verify decode parity
        run: SRC=$GITHUB_WORKSPACE WORK=/tmp/jcr bash tests/unix-build.sh

      - name: package
        run: |
          set -euo pipefail
          v='${{ needs.verify-version.outputs.version }}'
          stage="jc_reborn-$v-linux-x86_64"
          mkdir -p "$stage"
          # build-unix, not build-linux: tests/unix-build.sh builds one directory
          # name on both hosts now. This path is only exercised by a tag push, so
          # a stale name here would have gone unnoticed until a release failed.
          cp /tmp/jcr/build-unix/jc_reborn "$stage/"
          cp assets/scrantic_data.zip README.md LICENSE "$stage/"
          tar czf "$stage.tar.gz" "$stage"

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: '*.tar.gz'
          if-no-files-found: error

  web:
    name: Web package
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # MUST be explicit. On a tag push github.ref is the tag, but on a
          # workflow_dispatch it is whatever branch the UI defaulted to - so
          # without this a manual run builds main, checks main's version against
          # the tag, and publishes the result under the tag's name. The binaries
          # would not be the tagged source and nothing would say so.
          ref: ${{ github.event.inputs.tag || github.ref }}
      # PINNED. A release must be reproducible from its tag, and with `latest`
      # the web artifact depended on whatever emsdk HEAD happened to be that day.
      # Keep this in step with the same pin in ci.yml.
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.9

      - run: |
          emcmake cmake -S . -B build_web -DCMAKE_BUILD_TYPE=Release
          cmake --build build_web -j"$(nproc)"

      - name: package
        run: |
          set -euo pipefail
          v='${{ needs.verify-version.outputs.version }}'
          stage="jc_reborn-$v-web"
          mkdir -p "$stage"
          # index.html and favicon.ico are sources, not build output, and nothing
          # in the build copies them - so a build_web/ directory on its own is
          # not servable. Assemble the whole page here.
          cp build_web/jc_reborn.js build_web/jc_reborn.wasm build_web/jc_reborn.data "$stage/"
          cp index.html favicon.ico README.md LICENSE "$stage/"
          tar czf "$stage.tar.gz" "$stage"

      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: '*.tar.gz'
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [verify-version, windows, linux, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - run: ls -la dist

      #  THE PLATFORM-SUPPORT NOTE IS PART OF THE RELEASE, not just the README.
      #
      #  A version number implies "this works", and for macOS that is not a claim
      #  this project can make: the cross-platform CI check runs `dump`, which
      #  opens no window, so macOS compiles its rendering code and never executes
      #  it. Saying so where people download is the difference between a caveat
      #  and a caveat nobody reads. generate_release_notes appends the commit
      #  summary underneath this.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Johnny Reborn ${{ needs.verify-version.outputs.version }}
          generate_release_notes: true
          draft: false
          files: dist/*
          body: |
            ## Downloads

            | Platform | Status |
            |---|---|
            | **Windows x64** | Screensaver (`.scr`) + console build. Tested: 27 smoke checks, 11 screensaver checks, 2,452-file decode corpus |
            | **Linux x86_64** | Builds and decodes correctly. **Rendering is unverified** |
            | **Web** | Runs in a browser. Tested in headless Chromium |
            | **macOS** | **No download. Not validated.** See below |

            ### macOS is not validated, and there is no macOS build here

            `platform_macos.m` compiles on Apple hardware in CI, and its decoder
            output is byte-identical to the Windows reference across all 2,452
            files. That is the whole of what has been verified.

            **Nobody has ever looked at a frame this engine rendered on a Mac.**
            The cross-platform check runs `dump`, which never opens a window, so
            the Cocoa windowing and blitting code is compiled and then never
            executed. There is a specific open question about whether the frame
            comes out vertically flipped: the engine's buffer is top-down and
            `drawRect` draws into an unflipped `NSView`, where CoreGraphics puts
            the origin at bottom-left.

            No macOS artifact is published rather than shipping something that
            might render upside down. If you have a Mac and want to help, building
            from source and reporting what you see would settle it.

            Linux is in a milder version of the same position: it builds and
            decodes correctly in CI, but nothing there renders a pixel either.
            Windows and Web are the two platforms where rendering is actually
            exercised by automated tests.
