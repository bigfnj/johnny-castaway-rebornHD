# Cut a release from a tag.
#
# Trigger:  git tag v0.9.0 && git push origin v0.9.0
#
# THE TAG AND THE SOURCE MUST AGREE. The first job refuses to publish when the
# tag does not match project(... VERSION ...) in CMakeLists.txt. Without that
# check the two drift silently and you end up shipping a binary that prints a
# different version than the release it is attached to, which is the sort of
# thing nobody notices until they are debugging a user's bug report against the
# wrong source.
#
# Every artifact is built from the tagged commit by the same CMake the developers
# use; nothing is uploaded from a workstation.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (must already exist)'
        required: true

permissions:
  contents: write

jobs:
  verify-version:
    name: Tag matches source version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # MUST be explicit. On a tag push github.ref is the tag, but on a
          # workflow_dispatch it is whatever branch the UI defaulted to - so
          # without this a manual run builds main, checks main's version against
          # the tag, and publishes the result under the tag's name. The binaries
          # would not be the tagged source and nothing would say so.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - id: check
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          tag_version="${tag#v}"

          # Read the single source of truth rather than a duplicated constant.
          src_version=$(grep -oP 'project\(jc_reborn VERSION \K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt)

          echo "tag    : $tag  (version $tag_version)"
          echo "source : $src_version  (CMakeLists.txt)"

          if [ "$tag_version" != "$src_version" ]; then
            echo "FAIL tag $tag does not match project(... VERSION $src_version ...) in CMakeLists.txt"
            echo "     bump CMakeLists.txt and re-tag, or tag v$src_version"
            exit 1
          fi
          echo "version=$src_version" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows package
    needs: verify-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # MUST be explicit. On a tag push github.ref is the tag, but on a
          # workflow_dispatch it is whatever branch the UI defaulted to - so
          # without this a manual run builds main, checks main's version against
          # the tag, and publishes the result under the tag's name. The binaries
          # would not be the tagged source and nothing would say so.
          ref: ${{ github.event.inputs.tag || github.ref }}

      # The full gate, not just a build: a release must pass the same smoke and
      # regression checks a commit does.
      - shell: pwsh
        run: .\gate.ps1

      - name: package
        shell: pwsh
        run: |
          $v = '${{ needs.verify-version.outputs.version }}'
          $stage = "jc_reborn-$v-windows-x64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item build/Release/jc_reborn.exe        $stage/
          # The screensaver is a second target from the same sources, built
          # /SUBSYSTEM:WINDOWS. It is the reason most people will download this,
          # so shipping only the console exe would miss the point.
          Copy-Item build/Release/jc_reborn.scr        $stage/
          Copy-Item build/Release/scrantic_data.zip    $stage/
          Copy-Item README.md, LICENSE                 $stage/
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: '*.zip'
          if-no-files-found: error

  linux:
    name: Linux package
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # MUST be explicit. On a tag push github.ref is the tag, but on a
          # workflow_dispatch it is whatever branch the UI defaulted to - so
          # without this a manual run builds main, checks main's version against
          # the tag, and publishes the result under the tag's name. The binaries
          # would not be the tagged source and nothing would say so.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake python3 libx11-dev libasound2-dev xvfb xauth

      - name: build and verify decode parity
        run: SRC=$GITHUB_WORKSPACE WORK=/tmp/jcr bash tests/unix-build.sh

      - name: package
        run: |
          set -euo pipefail
          v='${{ needs.verify-version.outputs.version }}'
          stage="jc_reborn-$v-linux-x86_64"
          mkdir -p "$stage"
          # build-unix, not build-linux: tests/unix-build.sh builds one directory
          # name on both hosts now. This path is only exercised by a tag push, so
          # a stale name here would have gone unnoticed until a release failed.
          cp /tmp/jcr/build-unix/jc_reborn "$stage/"
          cp assets/scrantic_data.zip README.md LICENSE "$stage/"
          tar czf "$stage.tar.gz" "$stage"

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: '*.tar.gz'
          if-no-files-found: error

  macos:
    name: macOS package
    needs: verify-version
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # Shipped from 1.0.1 onward. Until then macOS was built and decode-checked
      # but no artifact was published, because nobody had seen it render. That
      # changed on 2026-09-14: rendering, colour, audio and input were all
      # confirmed by hand on Sequoia, and the close button bug that test found is
      # fixed. See BACKLOG.md for what is still unexercised there.
      - name: build and verify decode parity
        run: SRC=$GITHUB_WORKSPACE WORK=/tmp/jcr bash tests/unix-build.sh

      - name: verify packaged Intel architecture and negative control
        run: python3 -B tests/test_build_contracts.py --mac-binary /tmp/jcr/build-unix/jc_reborn

      - name: package
        run: |
          set -euo pipefail
          v='${{ needs.verify-version.outputs.version }}'
          stage="jc_reborn-$v-macos-x86_64"
          mkdir -p "$stage"
          cp /tmp/jcr/build-unix/jc_reborn "$stage/"
          cp assets/scrantic_data.zip README.md LICENSE "$stage/"
          # The no-dependency build path travels with it: Homebrew will not
          # install on Intel Macs, so anyone rebuilding needs this rather than
          # a CMake incantation.
          cp tools/build-macos.sh "$stage/"
          tar czf "$stage.tar.gz" "$stage"

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: '*.tar.gz'
          if-no-files-found: error

  web:
    name: Web package
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # MUST be explicit. On a tag push github.ref is the tag, but on a
          # workflow_dispatch it is whatever branch the UI defaulted to - so
          # without this a manual run builds main, checks main's version against
          # the tag, and publishes the result under the tag's name. The binaries
          # would not be the tagged source and nothing would say so.
          ref: ${{ github.event.inputs.tag || github.ref }}
      # The same digest, SDK version check and artifact checks as Web CI.
      - name: build with Emscripten 6.0.9 and verify preload artifacts
        run: python3 -B tools/build_web.py --platform-probes smoke

      # Match the Web CI sequence before packaging the tested page.
      - name: browser smoke
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
          python tests/web-smoke.py build_web

      - name: Web platform regression
        run: python3 -B tools/build_web.py --platform-probes regression --probes-only

      - name: art selector and build contract regression
        run: |
          python tests/web-art-controls.py build_web --mutation-check
          python3 -B tests/test_build_contracts.py --mutations

      - name: package
        run: |
          set -euo pipefail
          v='${{ needs.verify-version.outputs.version }}'
          stage="jc_reborn-$v-web"
          mkdir -p "$stage"
          cp build_web/jc_reborn.js build_web/jc_reborn.wasm build_web/jc_reborn.data "$stage/"
          cp build_web/index.html build_web/favicon.ico README.md LICENSE "$stage/"
          tar czf "$stage.tar.gz" "$stage"

      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: '*.tar.gz'
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [verify-version, windows, linux, macos, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - run: ls -la dist

      # Keep validation claims tied to suite names rather than changing counts.
      # Generated commit notes follow this reusable platform summary.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Johnny Reborn ${{ needs.verify-version.outputs.version }}
          generate_release_notes: true
          draft: false
          files: dist/*
          body: |
            ## Downloads

            | Platform | Status |
            |---|---|
            | **Windows x64** | Screensaver (`.scr`) + console build. Passes the full gate: native smoke, screensaver/settings tests, art regression and decode corpus |
            | **Linux x86_64** | Build/decode parity, real pthread controls and X11 resized-client pixel checks under Xvfb. Desktop fullscreen and physical audio remain separate checks |
            | **Web** | Passes browser runtime smoke and art selector regression in headless Chromium before packaging |
            | **macOS x86_64** | Verified Intel architecture, build/decode parity and Cocoa allocation/event checks. Rendering, audio and input last checked by hand on Sequoia on 2026-09-14 |

            All packages are built from the selected release tag. Window-pixel,
            backend-contract and headless decode tests establish different
            behavior; none alone proves every scene or physical audio device.

            To rebuild on macOS from a source checkout, run
            `bash tools/build-macos.sh` with the Xcode Command Line Tools installed.
            The script uses `clang` directly and is also exercised in CI.

            See `BACKLOG.md` in the source checkout for remaining verification gaps.
