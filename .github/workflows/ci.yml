# Continuous integration for johnny-castaway-rebornHD.
#
# WHY THIS FILE EXISTS. Three of this project's four platforms had not been
# compiled since a tree reorganisation, and one of them could not compile at all
# (platform_linux.c used PTHREAD_MUTEX_INITIALIZER with no <pthread.h>). Nothing
# noticed for months because there was no CI. Worse, docs/CHANGELOG.md and
# docs/AI_UNDERSTANDING.md both describe edits to a `.github/workflows/main.yml`
# that never existed, so the repository documented a safety net it did not have.
#
# Every job here therefore has to actually FAIL when the thing it guards breaks.
# Compiling is not the bar: the Windows and Linux jobs run the binary and check
# its output against a golden corpus.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # The repo's own gate: configure, build, 15+ smoke tests, and a 2,452-file
      # golden dump comparison. One exit code. Deliberately NOT re-implemented
      # here, so CI and a local run cannot drift apart.
      - name: gate
        shell: pwsh
        run: .\gate.ps1

      - name: native archive prerequisites
        shell: pwsh
        run: powershell.exe -NoProfile -File tests/Test-ArtAssetRefresh.ps1 -VerifyMutation

      - name: actual application archive wiring and gate refusal
        shell: pwsh
        run: python -B tests/test_runtime_data_project.py --mutations

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: windows-build-fixture-evidence
          path: |
            build/cleanup-fixtures/**/*.log
            build/cleanup-fixtures/**/*.json
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jc_reborn-windows
          path: |
            build/Release/jc_reborn.exe
            build/Release/jc_reborn.scr
            build/Release/scrantic_data.zip
          if-no-files-found: error

  linux:
    name: Linux (GCC, X11 + ALSA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake ninja-build python3 libx11-dev libasound2-dev xvfb xauth

      - name: build failure and archive dependency controls
        run: |
          python3 -B tests/test_unix_build_flow.py --mutations
          python3 -B tests/test_web_workflow_flow.py --mutations
          python3 -B tests/test_runtime_data.py --generator "Unix Makefiles" --mutations
          python3 -B tests/test_runtime_data.py --generator Ninja --mutations

      # Builds, then runs `dump` with no X server and compares every decoded file
      # against the manifest generated on Windows. A hash that differs is a real
      # cross-platform decode defect, which is the strongest signal this project
      # has and costs nothing to check.
      - name: build and verify decode parity
        run: SRC=$GITHUB_WORKSPACE WORK=/tmp/jcr bash tests/unix-build.sh

  macos:
    name: macOS (Clang, Cocoa + AudioToolbox)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7

      # THIS JOB EXISTS BECAUSE macOS WAS BUILT NOWHERE. platform_macos.m is 634
      # lines of Objective-C that had never been compiled, on any machine, while
      # the README listed macOS as an equally supported platform and three fixes
      # were applied to it by reading the code alone.
      #
      # The runner ships cmake and the Xcode command line tools, so there is no
      # install step. Same script as Linux: `dump` needs no window server, so the
      # comparison against the Windows golden manifest works identically here and
      # catches any endianness, struct-packing or signed-char decode defect.
      #
      # Cocoa allocation/event probes accompany decode parity. Native scene
      # presentation remains covered by the documented Sequoia manual review.
      - name: build and verify decode parity
        run: SRC=$GITHUB_WORKSPACE WORK=/tmp/jcr bash tests/unix-build.sh

      - name: verify Intel release architecture and negative controls
        run: python3 -B tests/test_build_contracts.py --mutations --mac-binary /tmp/jcr/build-unix/jc_reborn

      # The development host is Windows; execute Cocoa guard mutations here
      # after ordinary smoke/regression so their detection is proved on macOS.
      - name: rebuilt Cocoa guard negative controls
        run: python3 -B tests/test_platform_mutations.py --platform macos --output /tmp/jcr/macos-mutations

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: macos-mutation-evidence
          path: /tmp/jcr/macos-mutations/mutation-report.json
          if-no-files-found: warn

      # Keep the documented direct-Clang path working alongside CMake.
      - name: build with clang only (no CMake, no Homebrew)
        run: |
          bash tools/build-macos.sh
          python3 -B tools/verify_macos_arch.py jc_reborn

  web:
    name: Web (Emscripten)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The official SDK image is pinned by digest in the shared builder. It
      # avoids setup-emsdk's GitHub/codeload download and action Node runtime.
      # Only Docker image acquisition retries; compiler/test failures stop.
      - name: build with Emscripten 6.0.9 and verify preload artifacts
        run: python3 -B tools/build_web.py --platform-probes smoke

      # "It compiled" was the only bar this target ever had to clear, and it was
      # clearing it while being silent and able to freeze the tab. Neither is
      # visible to a linker, so the page is actually loaded in a browser.
      - name: browser smoke test
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
          python tests/web-smoke.py build_web
          python tests/web-logging.py build_web --phase smoke

      - name: Web platform regression
        run: python3 -B tools/build_web.py --platform-probes regression --probes-only

      - name: Web audio, logging, art and build regression
        run: |
          python tests/web-audio-timing.py build_web
          python tests/web-logging.py build_web --phase regression
          python tests/web-art-controls.py build_web --mutation-check
          python3 -B tests/test_build_contracts.py --mutations

      - uses: actions/upload-artifact@v7
        with:
          name: jc_reborn-web
          path: build_web/
          if-no-files-found: error
