# Continuous integration for johnny-castaway-rebornHD.
#
# WHY THIS FILE EXISTS. Three of this project's four platforms had not been
# compiled since a tree reorganisation, and one of them could not compile at all
# (platform_linux.c used PTHREAD_MUTEX_INITIALIZER with no <pthread.h>). Nothing
# noticed for months because there was no CI. Worse, docs/CHANGELOG.md and
# docs/AI_UNDERSTANDING.md both describe edits to a `.github/workflows/main.yml`
# that never existed, so the repository documented a safety net it did not have.
#
# Every job here therefore has to actually FAIL when the thing it guards breaks.
# Compiling is not the bar: the Windows and Linux jobs run the binary and check
# its output against a golden corpus.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # The repo's own gate: configure, build, 15+ smoke tests, and a 2,452-file
      # golden dump comparison. One exit code. Deliberately NOT re-implemented
      # here, so CI and a local run cannot drift apart.
      - name: gate
        shell: pwsh
        run: .\gate.ps1

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jc_reborn-windows
          path: |
            build/Release/jc_reborn.exe
            build/Release/jc_reborn.scr
            build/Release/scrantic_data.zip
          if-no-files-found: error

  linux:
    name: Linux (GCC, X11 + ALSA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake libx11-dev libasound2-dev

      # Builds, then runs `dump` with no X server and compares every decoded file
      # against the manifest generated on Windows. A hash that differs is a real
      # cross-platform decode defect, which is the strongest signal this project
      # has and costs nothing to check.
      - name: build and verify decode parity
        run: SRC=$GITHUB_WORKSPACE WORK=/tmp/jcr bash tests/unix-build.sh

  macos:
    name: macOS (Clang, Cocoa + AudioToolbox)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # THIS JOB EXISTS BECAUSE macOS WAS BUILT NOWHERE. platform_macos.m is 634
      # lines of Objective-C that had never been compiled, on any machine, while
      # the README listed macOS as an equally supported platform and three fixes
      # were applied to it by reading the code alone.
      #
      # The runner ships cmake and the Xcode command line tools, so there is no
      # install step. Same script as Linux: `dump` needs no window server, so the
      # comparison against the Windows golden manifest works identically here and
      # catches any endianness, struct-packing or signed-char decode defect.
      #
      # What this does NOT prove is that anything RENDERS. drawRect builds a
      # CGImage from a top-down buffer and draws into an unflipped NSView, and
      # whether that comes out upside down is still unsettled. See BACKLOG.md.
      - name: build and verify decode parity
        run: SRC=$GITHUB_WORKSPACE WORK=/tmp/jcr bash tests/unix-build.sh

  web:
    name: Web (Emscripten)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # PINNED, not `latest`. `latest` makes the action fetch emsdk HEAD on every
      # run, which failed twice on 2026-09-14 with HTTP 504 from GitHub on
      # commits that touched no web code at all. A red CI that has nothing to do
      # with the change teaches people to hit re-run instead of reading, which is
      # how a real failure eventually gets waved through.
      #
      # It also made the toolchain a moving target: a build that passed last week
      # could fail today because upstream moved, with nothing in this repo's
      # history to explain it. 6.0.9 is what `latest` resolved to on every green
      # run so far. Bump it deliberately.
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.9

      - name: build
        run: |
          emcmake cmake -S . -B build_web -DCMAKE_BUILD_TYPE=Release
          cmake --build build_web -j"$(nproc)"

      # The linker emits jc_reborn.js and, via --preload-file, jc_reborn.data.
      # Asserting all three exist catches a silently half-linked build, which a
      # bare `cmake --build` exit code does not.
      - name: verify artifacts
        run: |
          set -e
          for f in jc_reborn.js jc_reborn.wasm jc_reborn.data; do
            test -s "build_web/$f" || { echo "FAIL missing or empty: $f"; exit 1; }
            echo "ok   $f ($(stat -c%s "build_web/$f") bytes)"
          done

      - name: assemble servable page
        # index.html and favicon.ico are sources, not build output, and nothing
        # in the build copies them - so build_web/ on its own is not servable.
        run: cp index.html favicon.ico build_web/

      # "It compiled" was the only bar this target ever had to clear, and it was
      # clearing it while being silent and able to freeze the tab. Neither is
      # visible to a linker, so the page is actually loaded in a browser.
      - name: browser smoke test
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
          python tests/web-smoke.py build_web

      - uses: actions/upload-artifact@v7
        with:
          name: jc_reborn-web
          path: build_web/
          if-no-files-found: error
